[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/wire-types",
    "crates/test-harness",
    "crates/cli",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1.47.1", features = ["full"] }
uniffi = "0.32.0"
rusqlite = { version = "0.32.1", features = ["bundled-sqlcipher-vendored-openssl"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
serde = { version = "1.0.219", features = ["derive"] }
zeroize = { version = "1.8.1", features = ["derive"] }
sha3 = "0.10.8"
data-encoding = "2.8.0"
rand = "0.9.4"
# rand_core 0.9's OsRng only implements TryCryptoRng; libsignal's bounds
# want Rng + CryptoRng, which `UnwrapErr<OsRng>` satisfies.
rand_core = "0.9"
# Session crypto: PQXDH + Double Ratchet + SPQR (Triple Ratchet), pinned by
# tag. This tag string is CRYPTO_VERSION (see schat_core::crypto_version).
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.4", features = ["mlkem1024"] }
bs58 = "0.5.1"
image = "0.25.6"
gif = "0.13.1"
qrcode = "0.14.1"
thiserror = "2.0.12"
async-trait = "0.1.88"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
curve25519-dalek = "4.1.3"
sha2 = "0.10.8"
# Tier-A queue-at-rest wrap (ported DropQueue KEK-AES-GCM semantics,
# platformless: key file instead of Android Keystore).
aes-gcm = "0.10.3"
# Profile display names must be NFC-normalized (ported `nameOk`).
unicode-normalization = "0.1.24"

proptest = "1.7.0"
tempfile = "3.20.0"
